    <g fill="#f5c26b" opacity=".8"><rect x="332" y="308" width="4" height="5"/><rect x="392" y="292" width="4" height="5"/><rect x="398" y="306" width="4" height="5"/><rect x="452" y="320" width="4" height="5"/><rect x="498" y="300" width="4" height="5"/><rect x="540" y="316" width="4" height="5"/></g>
  </g>
  <path d="M440 176 V396 M300 286 H580" stroke="#2a1f3a" stroke-width="3"/>

