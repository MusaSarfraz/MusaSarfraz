  <path class="verse" style="animation-delay:3s" d="M444 392 h32" stroke="#e9e1d0" stroke-width="2" stroke-linecap="round"/>
  <path class="verse" style="animation-delay:4.4s" d="M480 392 h14" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <!-- my book -->
  <rect x="564" y="354" width="48" height="76" rx="2" fill="#1c1426" stroke="#f5c26b" stroke-opacity=".7"/>
  <rect x="564" y="354" width="6" height="76" fill="#0f0a17"/>
  <text x="591" y="386" font-size="7.5" letter-spacing="1.5" text-anchor="middle" fill="#f5c26b">ALL THIS</text>
  <text x="591" y="397" font-size="9" letter-spacing="1.5" font-weight="700" text-anchor="middle" fill="#f5c26b">GRIEF</text>
  <path d="M578 408 h26" stroke="#f5c26b" stroke-opacity=".5"/>

