 rx="5" ry="3.6" transform="rotate(-20)" fill="#f5c26b"/><path d="M4.6 -1 V-22 q7 3 6 11" fill="none" stroke="#f5c26b" stroke-width="1.8" stroke-linecap="round"/></g></g>

  <rect width="1000" height="560" fill="url(#vig)"/>
