  <g class="pen"><line x1="508" y1="384" x2="498" y2="404" stroke="#f5c26b" stroke-width="3" stroke-linecap="round"/><circle cx="498" cy="405" r="1.8" fill="#2b2336"/></g>
  <!-- words rising -->
