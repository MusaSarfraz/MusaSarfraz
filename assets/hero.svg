  <g class="swing">
    <line x1="160" y1="0" x2="160" y2="172" stroke="#6b6278" stroke-width="3" stroke-dasharray="6 3"/>
    <rect x="124" y="170" width="72" height="190" rx="26" fill="url(#bag)"/>
    <rect x="124" y="196" width="72" height="5" fill="#0006"/><rect x="124" y="250" width="72" height="5" fill="#0006"/><rect x="124" y="304" width="72" height="5" fill="#0006"/>
    <rect x="124" y="168" width="72" height="14" rx="6" fill="#241a30"/>
    <path d="M140 190 q-6 80 0 160" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5" stroke-linecap="round"/>
    <text x="160" y="283" font-size="10" letter-spacing="3" text-anchor="middle" fill="#e9e1d0" opacity=".75">BOX</text>
  </g>

  <!-- writing desk -->
  <polygon class="flick" points="372,364 404,360 560,432 372,432" fill="url(#cone)"/>
  <rect x="290" y="430" width="340" height="12" rx="3" fill="url(#wood)"/>
  <rect x="304" y="442" width="10" height="58" fill="#150f1e"/><rect x="606" y="442" width="10" height="58" fill="#150f1e"/>
