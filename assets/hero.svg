  <rect x="673" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="697" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="745" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="769" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="793" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="841" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="865" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="913" y="420" width="14" height="38" rx="2" fill="#0c0a12"/><rect x="937" y="420" width="14" height="38" rx="2" fill="#0c0a12"/>
