<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Night room scene: a punching bag, a desk with a book and lamp, a piano and a pinned eye sketch. Musa Sarfraz: I box, I write, I play, I draw.">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05050a"/><stop offset="0.65" stop-color="#150f22"/><stop offset="1" stop-color="#1a1226"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#f5c26b" stop-opacity="0.45"/><stop offset="1" stop-color="#f5c26b" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c26b" stop-opacity="0.38"/><stop offset="1" stop-color="#f5c26b" stop-opacity="0"/></linearGradient>
  <linearGradient id="bag" x1="0" x2="1"><stop offset="0" stop-color="#5b0f23"/><stop offset="0.45" stop-color="#e11d48"/><stop offset="1" stop-color="#4a0b1c"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a30"/><stop offset="1" stop-color="#150f1e"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#e9e1d0"/><stop offset="1" stop-color="#f5c26b"/></linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <clipPath id="round"><rect width="1000" height="560" rx="20"/></clipPath>
</defs>
<style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .serif{font-family:Georgia, 'Times New Roman', 'Liberation Serif', serif}
  .star{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .halo{animation:pulse 6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .swing{transform-origin:160px 0px;animation:swing 3.6s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .bagshadow{transform-origin:160px 500px;animation:sh 3.6s ease-in-out infinite}
  @keyframes sh{0%,100%{transform:translateX(-14px) scaleX(.9)}50%{transform:translateX(14px) scaleX(.9)}}
  .flick{animation:fl 5s steps(1) infinite}
  @keyframes fl{0%{opacity:1}38%{opacity:.8}40%{opacity:1}71%{opacity:.85}73%{opacity:1}}
  .ink{stroke-dasharray:1;stroke-dashoffset:1;animation:write 7s ease-in-out infinite}
  @keyframes write{0%{stroke-dashoffset:1;opacity:1}38%,80%{stroke-dashoffset:0;opacity:1}94%,100%{stroke-dashoffset:0;opacity:0}}
  .pen{animation:pen 7s ease-in-out infinite}
  @keyframes pen{0%{transform:translate(0,0)}12%{transform:translate(-14px,4px)}24%{transform:translate(-4px,8px)}38%{transform:translate(-18px,11px)}60%,100%{transform:translate(0,0)}}
  .verse{animation:rise 6s ease-out infinite;opacity:0}
  @keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.8}100%{opacity:0;transform:translate(14px,-120px)}}
  .wk{animation:press 8s ease-in-out infinite}
  @keyframes press{0%{fill:#e9e1d0;transform:none}2%{fill:#f5c26b;transform:translateY(3px)}9%{fill:#e9e1d0;transform:none}100%{fill:#e9e1d0;transform:none}}
  .note{opacity:0;animation:nrise 8s ease-out infinite}
  @keyframes nrise{0%{opacity:0;transform:translate(0,0)}2%{opacity:1}22%{opacity:0;transform:translate(12px,-100px)}100%{opacity:0;transform:translate(12px,-100px)}}
  .sk{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 11s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:1;opacity:1}22%,84%{stroke-dashoffset:0;opacity:1}95%,100%{stroke-dashoffset:0;opacity:0}}
  .tear{animation:tear 11s ease-in infinite;opacity:0}
  @keyframes tear{0%,40%{opacity:0;transform:translateY(-6px)}50%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(10px)}90%,100%{opacity:0;transform:translateY(16px)}}
  .nm{animation:fade 2.4s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<g clip-path="url(#round)">
  <rect width="1000" height="560" fill="url(#sky)"/>
  <circle class="star" style="animation-delay:4.1s" cx="418" cy="34" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.5s" cx="110" cy="197" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.2s" cx="233" cy="29" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.8s" cx="85" cy="133" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.7s" cx="74" cy="299" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.2s" cx="659" cy="41" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:1.4s" cx="240" cy="33" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.9s" cx="161" cy="286" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.5s" cx="119" cy="106" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.1s" cx="743" cy="42" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.9s" cx="522" cy="282" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:1.5s" cx="490" cy="242" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.4s" cx="827" cy="102" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.4s" cx="321" cy="278" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.0s" cx="760" cy="239" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.8s" cx="88" cy="70" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.2s" cx="969" cy="260" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:1.7s" cx="698" cy="49" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.3s" cx="372" cy="264" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.5s" cx="109" cy="148" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.2s" cx="80" cy="41" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.6s" cx="711" cy="238" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.7s" cx="922" cy="187" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.8s" cx="519" cy="40" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.0s" cx="146" cy="136" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.8s" cx="906" cy="264" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.4s" cx="425" cy="291" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.5s" cx="852" cy="230" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.8s" cx="381" cy="204" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:3.3s" cx="194" cy="87" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:1.3s" cx="26" cy="258" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.7s" cx="18" cy="84" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.8s" cx="638" cy="299" r="1.2" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.3s" cx="721" cy="273" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:2.0s" cx="905" cy="296" r="1.6" fill="#e9e1d0"/><circle class="star" style="animation-delay:1.0s" cx="507" cy="215" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.5s" cx="227" cy="235" r="1" fill="#e9e1d0"/><circle class="star" style="animation-delay:0.0s" cx="629" cy="36" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.7s" cx="168" cy="284" r="0.8" fill="#e9e1d0"/><circle class="star" style="animation-delay:4.4s" cx="642" cy="23" r="0.8" fill="#e9e1d0"/>
  <circle class="halo" cx="104" cy="104" r="86" fill="url(#halo)"/>
  <circle cx="104" cy="104" r="34" fill="#f5c26b"/>
  <circle cx="92" cy="96" r="6" fill="#d9a54f" opacity=".7"/><circle cx="116" cy="118" r="8" fill="#d9a54f" opacity=".55"/><circle cx="118" cy="92" r="3.5" fill="#d9a54f" opacity=".6"/>

  <!-- name -->
  <g class="nm">
    <text class="serif" x="500" y="98" font-size="58" font-style="italic" text-anchor="middle" fill="url(#name)">Musa Sarfraz</text>
    <text x="500" y="132" font-size="13" letter-spacing="5" text-anchor="middle" fill="#a69fb8">I BOX · I WRITE · I PLAY · I DRAW</text>
  </g>

  <!-- floor -->
  <rect y="500" width="1000" height="60" fill="#0d0916"/>
  <rect y="500" width="1000" height="2" fill="#2a1f3a"/>

  <!-- window with a night skyline -->
  <clipPath id="win"><rect x="300" y="176" width="280" height="220" rx="4"/></clipPath>
  <rect x="294" y="170" width="292" height="232" rx="8" fill="#0b0814" stroke="#2a1f3a" stroke-width="2"/>
  <g clip-path="url(#win)">
