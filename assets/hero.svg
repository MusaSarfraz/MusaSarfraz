  <path class="ink" pathLength="1" style="animation-delay:.2s" d="M462 404 q6 -4 12 0 t12 0 t12 0 t12 -1" fill="none" stroke="#2b2336" stroke-width="1.6" stroke-linecap="round"/>
  <path class="ink" pathLength="1" style="animation-delay:.8s" d="M462 411 q6 -4 12 0 t12 0 t12 0 t8 0" fill="none" stroke="#2b2336" stroke-width="1.6" stroke-linecap="round"/>
